  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // === Firebase config kamu ===
    const firebaseConfig = {
      apiKey: "AIzaSyB2VVmt2zI4SKlVVvT6zY2zvgvApBAsifI",
      authDomain: "fira-dashboard.firebaseapp.com",
      projectId: "fira-dashboard",
      storageBucket: "fira-dashboard.firebasestorage.app",
      messagingSenderId: "40290902748",
      appId: "1:40290902748:web:8b4118c6908426fbdd4a19"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    // DOM
    const todayPill = document.getElementById("today-pill");
    const moodLabel = document.getElementById("mood-label");
    const moodButtons = document.querySelectorAll(".mood-btn");
    const authBtn = document.getElementById("auth-btn");
    const authStatus = document.getElementById("auth-status");

    const todoForm = document.getElementById("todo-form");
    const todoInput = document.getElementById("todo-input");
    const todoList = document.getElementById("todo-list");
    const taskCount = document.getElementById("task-count");
    const filterButtons = document.querySelectorAll(".filter-btns button");
    const categorySelect = document.getElementById("category-select");
    const dueDateInput = document.getElementById("due-date");
    const dueTimeInput = document.getElementById("due-time");
    const categoryFilter = document.getElementById("category-filter");

    const debtForm = document.getElementById("debt-form");
    const debtNameInput = document.getElementById("debt-name");
    const debtAmountInput = document.getElementById("debt-amount");
    const debtTypeSelect = document.getElementById("debt-type");
    const debtDueInput = document.getElementById("debt-due");
    const debtList = document.getElementById("debt-list");
    const debtSummary = document.getElementById("debt-summary");

    const billForm = document.getElementById("bill-form");
    const billNameInput = document.getElementById("bill-name");
    const billAmountInput = document.getElementById("bill-amount");
    const billNextDueInput = document.getElementById("bill-next-due");
    const billList = document.getElementById("bill-list");
    const billSummary = document.getElementById("bill-summary");

    // UTIL
    function getTodayKey() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }
    function setTodayPill() {
      const d = new Date();
      const dateText = d.toLocaleDateString("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short",
      });
      todayPill.textContent = "Today • " + dateText;
    }
    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      });
    }
    function formatDateOnly(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
      });
    }
    function formatTime(hhmm) {
      if (!hhmm) return "";
      return hhmm.slice(0, 5);
    }
    function mapCategoryToClass(category) {
      if (category === "The Lab") return "lab";
      if (category === "Self Development") return "self";
      if (category === "Health") return "health";
      if (category === "Admin/Errands") return "admin";
      return "other";
    }

    // Mood (LOCAL ONLY – per device)
    const MOOD_KEY_PREFIX = "fira-mood-";
    function loadMood() {
      const key = MOOD_KEY_PREFIX + getTodayKey();
      const saved = localStorage.getItem(key);
      if (!saved) {
        moodLabel.textContent = "not set yet";
        moodButtons.forEach((b) => b.classList.remove("active"));
        return;
      }
      try {
        const { mood, emoji } = JSON.parse(saved);
        moodLabel.textContent = `${emoji} ${mood}`;
        moodButtons.forEach((btn) => {
          const isActive =
            btn.dataset.mood === mood && btn.dataset.emoji === emoji;
          btn.classList.toggle("active", isActive);
        });
      } catch {
        moodLabel.textContent = "not set yet";
      }
    }
    function saveMood(mood, emoji) {
      const key = MOOD_KEY_PREFIX + getTodayKey();
      localStorage.setItem(key, JSON.stringify({ mood, emoji }));
    }
    moodButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const mood = btn.dataset.mood;
        const emoji = btn.dataset.emoji;
        moodButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        moodLabel.textContent = `${emoji} ${mood}`;
        saveMood(mood, emoji);
      });
    });

    // === AUTH + GLOBAL STATE ===
    let currentUser = null;
    let tasksUnsubscribe = null;
    let debtsUnsubscribe = null;
    let billsUnsubscribe = null;

    let tasks = [];
    let debts = [];
    let bills = [];

    authBtn.addEventListener("click", async () => {
      if (currentUser) {
        await signOut(auth);
      } else {
        await signInWithPopup(auth, provider);
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user || null;

      // clear listeners dulu
      if (tasksUnsubscribe) { tasksUnsubscribe(); tasksUnsubscribe = null; }
      if (debtsUnsubscribe) { debtsUnsubscribe(); debtsUnsubscribe = null; }
      if (billsUnsubscribe) { billsUnsubscribe(); billsUnsubscribe = null; }

      if (currentUser) {
        authBtn.textContent = "Sign out";
        authStatus.textContent = currentUser.email;

        subscribeTasks();
        subscribeDebts();
        subscribeBills();
      } else {
        authBtn.textContent = "Sign in";
        authStatus.textContent = "";

        tasks = [];
        debts = [];
        bills = [];
        renderTasks();
        renderDebts();
        renderBills();
      }
    });

    // === TASKS (Firestore) ===
    function subscribeTasks() {
      if (!currentUser) return;
      const tasksRef = collection(db, "users", currentUser.uid, "tasks");
      const q = query(tasksRef, orderBy("createdAt", "asc"));
      tasksUnsubscribe = onSnapshot(q, (snapshot) => {
        tasks = snapshot.docs.map((docSnap) => ({
          id: docSnap.id,
          ...docSnap.data(),
        }));
        renderTasks();
      });
    }

    async function addTaskToDb(text, category, dueDate, dueTime) {
      if (!currentUser) {
        alert("Please sign in first to sync tasks 🙏");
        return;
      }
      const trimmed = text.trim();
      if (!trimmed) return;
      const now = new Date().toISOString();
      const tasksRef = collection(db, "users", currentUser.uid, "tasks");
      await addDoc(tasksRef, {
        text: trimmed,
        done: false,
        category: category || "Self Development",
        dueDate: dueDate || "",
        dueTime: dueTime || "",
        createdAt: now,
        completedAt: null,
      });
    }

    async function toggleTaskInDb(id, done) {
      if (!currentUser) return;
      const taskRef = doc(db, "users", currentUser.uid, "tasks", id);
      const now = new Date().toISOString();
      await updateDoc(taskRef, {
        done,
        completedAt: done ? now : null,
      });
    }

    async function deleteTaskInDb(id) {
      if (!currentUser) return;
      const taskRef = doc(db, "users", currentUser.uid, "tasks", id);
      await deleteDoc(taskRef);
    }

    let currentFilter = "all";
    let currentCategoryFilter = "all";

    function getFilteredTasks() {
      let filtered = tasks;
      if (currentFilter === "active") filtered = filtered.filter((t) => !t.done);
      if (currentFilter === "done") filtered = filtered.filter((t) => t.done);
      if (currentCategoryFilter !== "all") {
        filtered = filtered.filter((t) => t.category === currentCategoryFilter);
      }
      return filtered;
    }

    function renderTasks() {
      todoList.innerHTML = "";
      const filtered = getFilteredTasks();
      filtered.forEach((task) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const main = document.createElement("div");
        main.className = "task-main";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () =>
          toggleTaskInDb(task.id, !task.done)
        );

        const content = document.createElement("div");

        const textSpan = document.createElement("div");
        textSpan.className = "task-text";
        textSpan.textContent = task.text;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const catSpan = document.createElement("span");
        catSpan.className = `chip ${mapCategoryToClass(task.category)}`;
        catSpan.textContent = task.category || "Self Development";
        meta.appendChild(catSpan);

        if (task.dueDate || task.dueTime) {
          const dueSpan = document.createElement("span");
          let dueText = "Due: ";
          if (task.dueDate) dueText += formatDateOnly(task.dueDate);
          if (task.dueTime) dueText += ` ${formatTime(task.dueTime)}`;
          dueSpan.textContent = dueText;
          meta.appendChild(dueSpan);
        }

        if (task.completedAt) {
          const compSpan = document.createElement("span");
          compSpan.textContent = "Done: " + formatDate(task.completedAt);
          meta.appendChild(compSpan);
        }

        content.appendChild(textSpan);
        content.appendChild(meta);

        main.appendChild(checkbox);
        main.appendChild(content);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteTaskInDb(task.id));

        li.appendChild(main);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });

      const activeCount = tasks.filter((t) => !t.done).length;
      const total = tasks.length;
      taskCount.textContent =
        total === 0 ? "No tasks" : `${activeCount} active / ${total} total`;
    }

    todoForm.addEventListener("submit", (e) => {
      e.preventDefault();
      addTaskToDb(
        todoInput.value,
        categorySelect.value,
        dueDateInput.value,
        dueTimeInput.value
      );
      todoInput.value = "";
      todoInput.focus();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach((b) =>
          b.classList.toggle("active", b === btn)
        );
        renderTasks();
      });
    });

    categoryFilter.addEventListener("change", () => {
      currentCategoryFilter = categoryFilter.value;
      renderTasks();
    });

    // === DEBTS (Firestore) ===
    function subscribeDebts() {
      if (!currentUser) return;
      const debtsRef = collection(db, "users", currentUser.uid, "debts");
      const q = query(debtsRef, orderBy("createdAt", "asc"));
      debtsUnsubscribe = onSnapshot(q, (snapshot) => {
        debts = snapshot.docs.map((docSnap) => ({
          id: docSnap.id,
          ...docSnap.data(),
        }));
        renderDebts();
      });
    }

    async function addDebtToDb(name, amount, type, dueDate) {
      if (!currentUser) {
        alert("Please sign in first to sync debts 🙏");
        return;
      }
      const trimmed = name.trim();
      const num = Number(amount);
      if (!trimmed || !num) return;
      const now = new Date().toISOString();
      const debtsRef = collection(db, "users", currentUser.uid, "debts");
      await addDoc(debtsRef, {
        name: trimmed,
        amount: num,
        type,
        dueDate: dueDate || "",
        createdAt: now,
      });
    }

    async function deleteDebtInDb(id) {
      if (!currentUser) return;
      const debtRef = doc(db, "users", currentUser.uid, "debts", id);
      await deleteDoc(debtRef);
    }

    function renderDebts() {
      debtList.innerHTML = "";
      let totalIOwe = 0;
      let totalTheyOwe = 0;

      debts.forEach((debt) => {
        if (debt.type === "i-owe") totalIOwe += debt.amount;
        else totalTheyOwe += debt.amount;

        const li = document.createElement("li");

        const left = document.createElement("div");
        left.style.flex = "1";

        const title = document.createElement("div");
        title.className = "task-text";
        title.textContent =
          debt.type === "i-owe"
            ? `${debt.name} – I owe`
            : `${debt.name} – owes me`;
        left.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const amountSpan = document.createElement("span");
        amountSpan.textContent = `Amount: ${debt.amount.toLocaleString("id-ID")}`;
        meta.appendChild(amountSpan);

        if (debt.dueDate) {
          const dueSpan = document.createElement("span");
          dueSpan.textContent = "Due: " + formatDate(debt.dueDate);
          meta.appendChild(dueSpan);
        }

        const badge = document.createElement("span");
        badge.className =
          "badge " + (debt.type === "i-owe" ? "badge-io" : "badge-they");
        badge.textContent = debt.type === "i-owe" ? "I owe" : "They owe me";
        meta.appendChild(badge);

        left.appendChild(meta);

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => deleteDebtInDb(debt.id));

        li.appendChild(left);
        li.appendChild(delBtn);
        debtList.appendChild(li);
      });

      debtSummary.textContent =
        `Total I owe: ${totalIOwe.toLocaleString("id-ID")} • ` +
        `Total they owe me: ${totalTheyOwe.toLocaleString("id-ID")}`;
    }

    debtForm.addEventListener("submit", (e) => {
      e.preventDefault();
      addDebtToDb(
        debtNameInput.value,
        debtAmountInput.value,
        debtTypeSelect.value,
        debtDueInput.value
      );
      debtNameInput.value = "";
      debtAmountInput.value = "";
      debtDueInput.value = "";
      debtNameInput.focus();
    });

    // === BILLS (Firestore) ===
    function daysUntil(dateStr) {
      const today = new Date();
      const target = new Date(dateStr);
      if (isNaN(target.getTime())) return null;
      const diffMs = target.setHours(0,0,0,0) - today.setHours(0,0,0,0);
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    }

    function subscribeBills() {
      if (!currentUser) return;
      const billsRef = collection(db, "users", currentUser.uid, "bills");
      const q = query(billsRef, orderBy("createdAt", "asc"));
      billsUnsubscribe = onSnapshot(q, (snapshot) => {
        bills = snapshot.docs.map((docSnap) => ({
          id: docSnap.id,
          ...docSnap.data(),
        }));
        renderBills();
      });
    }

    async function addBillToDb(name, amount, nextDue) {
      if (!currentUser) {
        alert("Please sign in first to sync bills 🙏");
        return;
      }
      const trimmed = name.trim();
      const num = Number(amount);
      if (!trimmed || !num || !nextDue) return;
      const now = new Date().toISOString();
      const billsRef = collection(db, "users", currentUser.uid, "bills");
      await addDoc(billsRef, {
        name: trimmed,
        amount: num,
        nextDue,
        createdAt: now,
      });
    }

    async function deleteBillInDb(id) {
      if (!currentUser) return;
      const billRef = doc(db, "users", currentUser.uid, "bills", id);
      await deleteDoc(billRef);
    }

    function renderBills() {
      billList.innerHTML = "";
      let dueSoonCount = 0;

      bills.forEach((bill) => {
        const li = document.createElement("li");

        const left = document.createElement("div");
        left.style.flex = "1";

        const title = document.createElement("div");
        title.className = "task-text";
        title.textContent = bill.name;
        left.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const amountSpan = document.createElement("span");
        amountSpan.textContent = `Rp ${bill.amount.toLocaleString("id-ID")}`;
        meta.appendChild(amountSpan);

        const dueSpan = document.createElement("span");
        const days = daysUntil(bill.nextDue);
        let dueText = "Next due: " + formatDate(bill.nextDue);
        if (days !== null) {
          if (days < 0) {
            dueText += ` (overdue ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"})`;
          } else if (days === 0) {
            dueText += " (today)";
            dueSpan.classList.add("bill-due-soon");
            dueSoonCount++;
          } else if (days <= 7) {
            dueText += ` (in ${days} day${days === 1 ? "" : "s"})`;
            dueSpan.classList.add("bill-due-soon");
            dueSoonCount++;
          }
        }
        dueSpan.textContent = dueText;
        meta.appendChild(dueSpan);

        left.appendChild(meta);

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => deleteBillInDb(bill.id));

        li.appendChild(left);
        li.appendChild(delBtn);
        billList.appendChild(li);
      });

      billSummary.textContent = `Bills due in next 7 days: ${dueSoonCount}`;
    }

    billForm.addEventListener("submit", (e) => {
      e.preventDefault();
      addBillToDb(
        billNameInput.value,
        billAmountInput.value,
        billNextDueInput.value
      );
      billNameInput.value = "";
      billAmountInput.value = "";
      billNextDueInput.value = "";
      billNameInput.focus();
    });

    // INIT
    setTodayPill();
    loadMood();
  </script>
