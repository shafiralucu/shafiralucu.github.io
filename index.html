<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fira's To-Do List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffeaf4, #ffeef9);
      --primary: #ff4fa3;
      --primary-soft: #ff7ac4;
      --primary-dark: #e53c8d;
      --card-bg: #ffffff;
      --text-main: #323232;
      --text-muted: #8e8e99;
      --border-soft: #ffe0f0;
      --shadow-soft: 0 18px 40px rgba(255, 120, 196, 0.24);
      --radius-card: 22px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      padding: 18px;
    }

    .app {
      background: var(--card-bg);
      width: 100%;
      max-width: 540px;
      padding: 22px 20px 18px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .app::before,
    .app::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.4;
      pointer-events: none;
    }
    .app::before {
      width: 180px;
      height: 180px;
      background: #ffe0f7;
      top: -70px;
      right: -40px;
    }
    .app::after {
      width: 160px;
      height: 160px;
      background: #ffe8c6;
      bottom: -70px;
      left: -40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .top-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .top-date-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: #ffe9f6;
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .top-greeting {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .top-question {
      font-size: 11px;
      color: var(--text-muted);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd6f0, #ff9ccf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffffff;
      font-size: 18px;
      box-shadow: 0 6px 14px rgba(255, 120, 196, 0.45);
      flex-shrink: 0;
    }

    .mood-card {
      background: linear-gradient(135deg, #fff1f8, #fffdfc);
      border-radius: 18px;
      padding: 10px 12px;
      border: 1px solid #ffe0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .mood-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mood-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .mood-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .mood-label {
      font-weight: 600;
      color: var(--primary-dark);
    }

    .mood-options {
      display: flex;
      gap: 6px;
    }

    .mood-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: #ffffffcc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .mood-btn.active {
      border-color: #ffd3ec;
      background: #ffe6f5;
      box-shadow: 0 4px 10px rgba(255, 120, 196, 0.45);
      transform: translateY(-1px);
    }

    h1 {
      margin: 8px 0 2px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text-main);
      position: relative;
      z-index: 1;
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 12px;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"],
    select,
    input[type="date"],
    input[type="time"] {
      padding: 9px 11px;
      border-radius: 14px;
      border: 1px solid #f7d7ec;
      font-size: 13px;
      background: #fff9fd;
      color: var(--text-main);
    }

    input[type="text"] {
      flex: 1;
      min-width: 160px;
    }

    select,
    input[type="date"],
    input[type="time"] {
      flex: 1;
      min-width: 120px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(255, 120, 196, 0.4);
      background: #fff;
    }

    button {
      border: none;
      padding: 9px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #add-btn {
      background-image: linear-gradient(135deg, var(--primary-soft), var(--primary));
      color: white;
      box-shadow: 0 8px 18px rgba(229, 60, 141, 0.35);
    }

    #add-btn:hover {
      filter: brightness(1.05);
    }

    #add-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(229, 60, 141, 0.4);
    }

    #add-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 2px 0 8px;
      max-height: 300px;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }

    li {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 14px;
      background: linear-gradient(
        120deg,
        #fff1f8,
        #fff7fb 40%,
        #ffffff 100%
      );
      border: 1px solid #ffe0f0;
      font-size: 13px;
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex: 1;
    }

    .task-main input[type="checkbox"] {
      margin-top: 3px;
      accent-color: var(--primary);
    }

    .task-text {
      font-weight: 600;
      word-break: break-word;
      color: var(--text-main);
    }

    .done .task-text {
      text-decoration: line-through;
      color: #b3a5b2;
      font-weight: 500;
    }

    .task-meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 600;
    }

    .chip.lab {
      background: #ffe8d2;
      color: #d86c00;
    }

    .chip.self {
      background: #f5e4ff;
      color: #8b46d9;
    }

    .chip.health {
      background: #e5f9f0;
      color: #109c5f;
    }

    .chip.admin {
      background: #ffe3f4;
      color: #d33692;
    }

    .chip.other {
      background: #f2f2ff;
      color: #6f6fd1;
    }

    .delete-btn {
      background: transparent;
      color: #ff6a88;
      padding: 4px 8px;
      font-size: 11px;
    }

    .delete-btn:hover {
      color: #ff3b6c;
    }

    .bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }

    .bottom-top,
    .bottom-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btns button {
      background: transparent;
      color: var(--text-muted);
      padding: 4px 9px;
      font-size: 11px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
    }

    .filter-btns button.active {
      color: var(--primary-dark);
      border-color: #ffd3ec;
      background: #ffe9f6;
      font-weight: 600;
    }

    #category-filter {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid #f7d7ec;
      background: #fff9fd;
      color: var(--text-main);
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="top-text">
        <div class="top-date-pill" id="today-pill">Today • --</div>
        <div class="top-greeting">Hi, Fira 👋</div>
        <div class="top-question">How do you feel today?</div>
      </div>
      <div class="avatar">F</div>
    </div>

    <div class="mood-card">
      <div class="mood-left">
        <div class="mood-title">Today’s mood</div>
        <div class="mood-subtitle">
          You feel: <span class="mood-label" id="mood-label">not set yet</span>
        </div>
      </div>
      <div class="mood-options">
        <button class="mood-btn" data-mood="Tired" data-emoji="😭">😭</button>
        <button class="mood-btn" data-mood="Meh" data-emoji="😐">😐</button>
        <button class="mood-btn" data-mood="Okay" data-emoji="🙂">🙂</button>
        <button class="mood-btn" data-mood="Excited" data-emoji="🤩">🤩</button>
      </div>
    </div>

    <h1>Daily To-Do</h1>
    <p class="subtitle">Cute cycle-app vibes 💗 track tasks, due dates & wins.</p>

    <form id="todo-form">
      <div class="row">
        <input
          id="todo-input"
          type="text"
          placeholder="Type a task… e.g. '30 mins coding'"
          autocomplete="off"
        />
        <button type="submit" id="add-btn">Add</button>
      </div>
      <div class="row">
        <select id="category-select">
          <option value="The Lab">The Lab</option>
          <option value="Self Development" selected>Self Development</option>
          <option value="Health">Health</option>
          <option value="Admin/Errands">Admin/Errands</option>
          <option value="Others">Others</option>
        </select>
        <input id="due-date" type="date" />
        <input id="due-time" type="time" />
      </div>
    </form>

    <ul id="todo-list"></ul>

    <div class="bottom">
      <div class="bottom-top">
        <span id="task-count">No tasks</span>
        <div class="filter-btns">
          <button data-filter="all" class="active">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="done">Done</button>
        </div>
      </div>
      <div class="bottom-bottom">
        <span>Category filter:</span>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="The Lab">The Lab</option>
          <option value="Self Development">Self Development</option>
          <option value="Health">Health</option>
          <option value="Admin/Errands">Admin/Errands</option>
          <option value="Others">Others</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const taskCount = document.getElementById("task-count");
    const filterButtons = document.querySelectorAll(".filter-btns button");
    const categorySelect = document.getElementById("category-select");
    const dueDateInput = document.getElementById("due-date");
    const dueTimeInput = document.getElementById("due-time");
    const categoryFilter = document.getElementById("category-filter");

    const todayPill = document.getElementById("today-pill");
    const moodLabel = document.getElementById("mood-label");
    const moodButtons = document.querySelectorAll(".mood-btn");

    const STORAGE_KEY_V2 = "fira-todo-list-v2";
    const STORAGE_KEY_V1 = "fira-todo-list-v1";
    const MOOD_KEY_PREFIX = "fira-mood-";

    let tasks = [];
    let currentFilter = "all";
    let currentCategoryFilter = "all";

    function getTodayKey() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function setTodayPill() {
      const d = new Date();
      const dateText = d.toLocaleDateString("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short",
      });
      todayPill.textContent = "Today • " + dateText;
    }

    function mapCategoryToClass(category) {
      if (category === "The Lab") return "lab";
      if (category === "Self Development") return "self";
      if (category === "Health") return "health";
      if (category === "Admin/Errands") return "admin";
      return "other";
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      });
    }

    function formatDateOnly(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
      });
    }

    function formatTime(hhmm) {
      if (!hhmm) return "";
      return hhmm.slice(0, 5);
    }

    function loadTasks() {
      const savedV2 = localStorage.getItem(STORAGE_KEY_V2);
      if (savedV2) {
        tasks = JSON.parse(savedV2);
        renderTasks();
        return;
      }

      const savedV1 = localStorage.getItem(STORAGE_KEY_V1);
      if (savedV1) {
        const oldTasks = JSON.parse(savedV1);
        tasks = oldTasks.map((t) => ({
          id: t.id || Date.now(),
          text: t.text || "",
          done: !!t.done,
          category: "Self Development",
          dueDate: "",
          dueTime: "",
          createdAt: new Date().toISOString(),
          completedAt: t.done ? new Date().toISOString() : null,
        }));
        saveTasks();
        renderTasks();
        return;
      }

      tasks = [];
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(tasks));
    }

    function addTask(text, category, dueDate, dueTime) {
      const trimmed = text.trim();
      if (!trimmed) return;
      const now = new Date().toISOString();
      tasks.push({
        id: Date.now(),
        text: trimmed,
        done: false,
        category: category || "Self Development",
        dueDate: dueDate || "",
        dueTime: dueTime || "",
        createdAt: now,
        completedAt: null,
      });
      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map((task) => {
        if (task.id === id) {
          const now = new Date().toISOString();
          const newDone = !task.done;
          return {
            ...task,
            done: newDone,
            completedAt: newDone ? now : null,
          };
        }
        return task;
      });
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter((task) => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
      renderTasks();
    }

    function setCategoryFilter(cat) {
      currentCategoryFilter = cat;
      renderTasks();
    }

    function getFilteredTasks() {
      let filtered = tasks;
      if (currentFilter === "active") filtered = filtered.filter((t) => !t.done);
      if (currentFilter === "done") filtered = filtered.filter((t) => t.done);
      if (currentCategoryFilter !== "all") {
        filtered = filtered.filter((t) => t.category === currentCategoryFilter);
      }
      return filtered;
    }

    function renderTasks() {
      list.innerHTML = "";
      const filtered = getFilteredTasks();

      filtered.forEach((task) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const main = document.createElement("div");
        main.className = "task-main";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const content = document.createElement("div");

        const textSpan = document.createElement("div");
        textSpan.className = "task-text";
        textSpan.textContent = task.text;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const catSpan = document.createElement("span");
        catSpan.className = `chip ${mapCategoryToClass(task.category)}`;
        catSpan.textContent = task.category;
        meta.appendChild(catSpan);

        if (task.dueDate || task.dueTime) {
          const dueSpan = document.createElement("span");
          let dueText = "Due: ";
          if (task.dueDate) dueText += formatDateOnly(task.dueDate);
          if (task.dueTime) dueText += ` ${formatTime(task.dueTime)}`;
          dueSpan.textContent = dueText;
          meta.appendChild(dueSpan);
        }

        if (task.completedAt) {
          const compSpan = document.createElement("span");
          compSpan.textContent = "Done: " + formatDate(task.completedAt);
          meta.appendChild(compSpan);
        }

        content.appendChild(textSpan);
        content.appendChild(meta);

        main.appendChild(checkbox);
        main.appendChild(content);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteTask(task.id));

        li.appendChild(main);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });

      const activeCount = tasks.filter((t) => !t.done).length;
      const total = tasks.length;
      taskCount.textContent =
        total === 0 ? "No tasks" : `${activeCount} active / ${total} total`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      addTask(
        input.value,
        categorySelect.value,
        dueDateInput.value,
        dueTimeInput.value
      );
      input.value = "";
      input.focus();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        setFilter(btn.dataset.filter);
      });
    });

    categoryFilter.addEventListener("change", () => {
      setCategoryFilter(categoryFilter.value);
    });

    function loadMood() {
      const key = MOOD_KEY_PREFIX + getTodayKey();
      const saved = localStorage.getItem(key);
      if (!saved) {
        moodLabel.textContent = "not set yet";
        moodButtons.forEach((b) => b.classList.remove("active"));
        return;
      }
      try {
        const { mood, emoji } = JSON.parse(saved);
        moodLabel.textContent = `${emoji} ${mood}`;
        moodButtons.forEach((btn) => {
          const isActive =
            btn.dataset.mood === mood && btn.dataset.emoji === emoji;
          btn.classList.toggle("active", isActive);
        });
      } catch {
        moodLabel.textContent = "not set yet";
      }
    }

    function saveMood(mood, emoji) {
      const key = MOOD_KEY_PREFIX + getTodayKey();
      localStorage.setItem(key, JSON.stringify({ mood, emoji }));
    }

    moodButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const mood = btn.dataset.mood;
        const emoji = btn.dataset.emoji;
        moodButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        moodLabel.textContent = `${emoji} ${mood}`;
        saveMood(mood, emoji);
      });
    });

    setTodayPill();
    loadTasks();
    loadMood();
  </script>
</body>
</html>
